services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: connectsphere
      POSTGRES_USER: cs
      POSTGRES_PASSWORD: cs_dev_password
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
