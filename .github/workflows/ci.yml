name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API - lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: connectsphere
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: cs_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
        working-directory: api
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        working-directory: api
      - name: Tests with coverage gate
        run: |
          mkdir -p test-results
          pytest --cov-branch --cov-report=json:test-results/api-coverage.json --junitxml=test-results/api-junit.xml
        working-directory: api
      - name: Save backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-evidence
          path: api/test-results/

  web:
    name: Web - types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Type check
        run: npm run lint
        working-directory: web
      - name: Unit tests
        run: |
          mkdir -p test-results
          npm run test -- --reporter=default --reporter=json --outputFile=test-results/vitest.json --coverage --coverage.include=src/pages/EquipmentPlan.tsx --coverage.include=src/api/equipmentPlans.ts --coverage.include=src/api/cancellation.ts --coverage.include=src/components/EventCancellation.tsx --coverage.include=src/components/equipment/EquipmentRelease.tsx --coverage.reporter=text --coverage.reporter=json --coverage.reportsDirectory=test-results/coverage
        working-directory: web
      - name: Production build
        run: npm run build
        working-directory: web
      - name: Save frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-evidence
          path: web/test-results/

  browser:
    name: Browser - real API and PostgreSQL journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: connectsphere
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: cs_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-browser-only-secret
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser.json
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/browser-junit.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install API dependencies
        run: pip install -r api/requirements.txt
      - name: Install web dependencies and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start isolated demo API
        working-directory: api
        run: |
          python manage.py migrate
          python manage.py seed_demo_data
          python manage.py runserver 127.0.0.1:8000 --noreload > ../api-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/auth/csrf/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat ../api-server.log
          exit 1
      - name: Real browser regression
        working-directory: web
        run: npx playwright test --workers=1 --retries=0 --reporter=list,json,junit
      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            web/test-results/
            api-server.log
